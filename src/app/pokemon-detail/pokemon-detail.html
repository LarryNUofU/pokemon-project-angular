@if (pokemon(); as pokemon) {
  <div class="title">
    <h2>{{ pokemon.displayName }}</h2>
  </div>
  <div class="artwork-gallery">
    <figure>
      <img
        [src]="pokemon.sprites.other?.['official-artwork']?.front_default"
        [alt]="pokemon.name ? `${pokemon.name} official artwork` : 'Pokemon official artwork'"
      />
      <figcaption>Official artwork</figcaption>
    </figure>

    <figure>
      <img
        [src]="pokemon.sprites.other?.['official-artwork']?.front_shiny"
        [alt]="pokemon.name ? `${pokemon.name} shiny official artwork` : 'Pokemon shiny artwork'"
      />
      <figcaption>Shiny artwork</figcaption>
    </figure>
  </div>

  <p class="description-button">
    <button
      type="button"
      class="btn btn-outline-primary"
      (click)="collapse.toggle()"
      [attr.aria-expanded]="!isCollapsed()"
      aria-controls="collapseExample"
    >
      Description
    </button>
  </p>
  <div #collapse="ngbCollapse" [ngbCollapse]="isCollapsed()" (ngbCollapseChange)="isCollapsed.set($event)">
    <div class="card">
      <div class="card-body">
        <h3>Height: {{ pokemon.heightInMeters }}m</h3>
        <h3>Abilities</h3>
        <ul>
          @for (entry of pokemon.abilities ?? []; track entry.slot) {
            <li>{{ entry.ability.name }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
}
