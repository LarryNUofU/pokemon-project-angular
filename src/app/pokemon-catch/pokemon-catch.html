<h1>Choose a region:</h1>
<div class="buttonsRow">
    <button class="genButton" [ngClass]="buttonClasses(1)" type="button" (click)="catchPokemon(1)">Generation I</button>
    <button class="genButton" [ngClass]="buttonClasses(2)" type="button" (click)="catchPokemon(2)">Generation II</button>
    <button class="genButton" [ngClass]="buttonClasses(3)" type="button" (click)="catchPokemon(3)">Generation III</button>
    <button class="genButton" [ngClass]="buttonClasses(4)" type="button" (click)="catchPokemon(4)">Generation IV</button>
    <button class="genButton" [ngClass]="buttonClasses(5)" type="button" (click)="catchPokemon(5)">Generation V</button>
    <button class="genButton" [ngClass]="buttonClasses(6)" type="button" (click)="catchPokemon(6)">Generation VI</button>
    <button class="genButton" [ngClass]="buttonClasses(7)" type="button" (click)="catchPokemon(7)">Generation VII</button>
    <button class="genButton" [ngClass]="buttonClasses(8)" type="button" (click)="catchPokemon(8)">Generation VIII</button>
    <button class="genButton" [ngClass]="buttonClasses(9)" type="button" (click)="catchPokemon(9)">Generation IX</button>
</div>
<h1> Pokemon Caught!</h1>
<h2> {{ pokemon()?.displayName }}</h2>
<img [src]="pokemon()?.sprites.other?.['official-artwork']?.front_default" />
<!-- @if (pokemon()?.isGrassType()) { -->
<!-- <h3>Shiny</h3>
<img [src]="pokemon()?.sprites.other?.['official-artwork']?.front_shiny" />
<!---} -->
<h3>Height: {{ pokemon()?.heightInMeters }}m</h3>
<h3>Abilities</h3>
<ul>
@for (entry of pokemon()?.abilities ?? []; track entry.slot) {
  <li>{{ entry.ability.name }}</li>
}
</ul>
